server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static export assets (Next.js build output) and the SPA shell
    location / {
        try_files $uri $uri.html $uri/ @backend;
    }

    # Everything not served by the static export is an API request —
    # the frontend is a single-page app with no other Next.js routes.
    location @backend {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        client_max_body_size 100M;
    }

    # Note: /admin is deliberately NOT listed here. The frontend's own
    # /admin/dashboard page lives under the same /admin/ prefix as the
    # backend's /admin/users, /admin/invites etc., so a prefix match here
    # would also swallow the frontend page route and 404 it against the
    # backend. Those backend routes still work correctly via the try_files
    # fallback below (@backend) since no static file matches their path.
    location ~ ^/(projects|files|tasks|art_direction|upload|video|voices|voice|config|docs|openapi\.json|series|library|health|system|debug|diagnose|bgm|subtitle|prompt_defaults|auth) {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        client_max_body_size 100M;
    }
}
