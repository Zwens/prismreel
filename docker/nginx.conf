server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static export assets (Next.js build output) and the SPA shell
    location / {
        try_files $uri $uri.html $uri/ @backend;
    }

    # Everything not served by the static export is an API request —
    # the frontend is a single-page app with no other Next.js routes.
    location @backend {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        client_max_body_size 100M;
    }

    location ~ ^/(projects|files|tasks|art_direction|upload|video|voices|voice|config|docs|openapi\.json|series|library|health|system|debug|diagnose|bgm|subtitle|prompt_defaults) {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        client_max_body_size 100M;
    }
}
