  # Seedance 2.5 (ByteDance, launched 2026-07-31). Reached through BytePlus
  # ModelArk / Volcano Ark, NOT MuleRouter — probed 2026-08-30, the gateway
  # 404s on every seedance-2.5 path variant while 2.0 answers 400.
  # Wire id is env-overridable; see src/models/byteplus.py.
  - id: seedance/seedance-2.5-video
    display_name: Seedance 2.5
    description: ByteDance Seedance 2.5 — native 30s takes, up to 4K, multimodal references
    status: active
    release_stage: stable
    docs:
      context_hub_doc_ids:
        - byteplus/modelark-seedance-2.5
    runtime:
      byteplus:
        gateway: byteplus
    modes:
      t2v:
        legacy_id: seedance-2.5-t2v
        display_name: Seedance 2.5 T2V
        description: Text-to-video, native long takes
        capabilities: [t2v]
        runtime:
          byteplus:
            api_model_id: dreamina-seedance-2-5-260628
        ui:
          selection_group: t2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 95
          badges: [new]
        duration:
          type: slider
          min: 4
          max: 30
          step: 1
          default: 5
        params:
          resolution:
            options: [480p, 720p, 1080p, 4k]
            default: 1080p
          seed: true
          negativePrompt: false
          promptExtend: false
          watermark: true
      i2v:
        legacy_id: seedance-2.5-i2v
        display_name: Seedance 2.5 I2V
        description: First-frame image to video
        capabilities: [i2v]
        runtime:
          byteplus:
            api_model_id: dreamina-seedance-2-5-260628
        ui:
          selection_group: i2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 95
          badges: [new]
        duration:
          type: slider
          min: 4
          max: 30
          step: 1
          default: 5
        params:
          resolution:
            options: [480p, 720p, 1080p, 4k]
            default: 1080p
          seed: true
          negativePrompt: false
          promptExtend: false
          watermark: true
        inputs:
          reference_images:
            max: 1
            reference_type: image
      r2v:
        legacy_id: seedance-2.5-r2v
        display_name: Seedance 2.5 R2V
        description: Multimodal reference-to-video, up to 50 reference assets
        capabilities: [r2v]
        runtime:
          byteplus:
            api_model_id: dreamina-seedance-2-5-260628
        ui:
          selection_group: r2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 95
          badges: [new]
        duration:
          type: slider
          min: 4
          max: 30
          step: 1
          default: 5
        params:
          resolution:
            options: [480p, 720p, 1080p, 4k]
            default: 1080p
          seed: true
          negativePrompt: false
          promptExtend: false
          watermark: true
        docs:
          context_hub_doc_ids:
            - byteplus/modelark-seedance-2.5
        inputs:
          reference_images:
            max: 50
            reference_type: image
