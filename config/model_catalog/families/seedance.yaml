  # Seedance 2.5 (ByteDance, launched 2026-07-31). Reached through BytePlus
  # ModelArk / Volcano Ark, NOT MuleRouter — probed 2026-08-30, the gateway
  # 404s on every seedance-2.5 path variant while 2.0 answers 400.
  # Wire id is fixed per catalog entry (not env-overridable); see
  # src/models/byteplus.py — an unrecognised id fails fast rather than
  # falling back.
