family: seedance
display_name: "Seedance (即梦)"
# The Seedance keys this project actually holds are issued by Seevio
# (https://seevio.ai, sk_live_ / sk_test_ prefix) — an aggregator, not
# ByteDance direct. MuleRouter (muk- keys) and BytePlus/Volcano Ark
# (Ark keys) stay wired up as alternative backends for anyone holding
# those credentials, but they are no longer the default.
provider: seevio
routing_prefixes:
  # Bare `seedance` so 2.5's flat ids (seedance-2.5-t2v) resolve too; the
  # longer prefixes stay for longest-match clarity.
  - seedance
  - seedance-2.0-
  - seedance-2.5-
  - seedance/seedance-
supported_backends:
  - seevio
  - mulerouter
  - byteplus
default_backend: seevio
backend_env_key: SEEDANCE_PROVIDER_MODE
credential_sources:
  seevio:
    - SEEVIO_API_KEY
  mulerouter:
    - MULEROUTER_API_KEY
  byteplus:
    - ARK_API_KEY
supported_modalities:
  - t2v
  - i2v
  - r2v
docs:
  official_snapshot_ids:
    - seevio/seedance/2026-08-31
    - mulerouter/seedance-2.0/2026-06-03
transport:
  image_input_mode:
    # Seevio takes image_urls[] and documents them as publicly reachable URLs;
    # it has no upload endpoint, so local files must go through OSS first.
    seevio: seevio_image_url
    mulerouter: mulerouter_base64_image
    # Ark takes an image_url item that may be a public URL or a data URI.
    byteplus: byteplus_ark_image_url
  audio_input_mode:
    seevio: seevio_audio_url
    mulerouter: mulerouter_audio_url
  reference_video_input_mode:
    seevio: seevio_video_url
    mulerouter: mulerouter_video_url
models:
  - id: seedance/seedance-2.0-video
    display_name: Seedance 2.0
    description: ByteDance Seedance 2.0 video generation via MuleRouter
    status: active
    release_stage: stable
    docs:
      context_hub_doc_ids:
        - seevio/seedance
        - mulerouter/seedance-2.0
    runtime:
      seevio:
        gateway: seevio
        api_model_id: seedance-2-0
      mulerouter:
        gateway: mulerouter
    modes:
      t2v:
        legacy_id: seedance-2.0-t2v
        display_name: Seedance 2.0 T2V
        description: Text-to-video generation
        capabilities: [t2v]
        ui:
          selection_group: t2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 85
          badges: [new]
        duration:
          type: slider
          min: 4
          max: 15
          step: 1
          default: 5
        params:
          resolution:
            # 480p verified accepted by the gateway on 2026-08-30; it rejects
            # anything outside {480p, 720p, 1080p}.
            options: [480p, 720p, 1080p]
            default: 1080p
          seed: true
          negativePrompt: false
          promptExtend: false
          watermark: true
      i2v:
        legacy_id: seedance-2.0-i2v
        display_name: Seedance 2.0 I2V
        description: Image-to-video generation
        capabilities: [i2v]
        ui:
          selection_group: i2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 90
          badges: [new]
        duration:
          type: slider
          min: 4
          max: 15
          step: 1
          default: 5
        params:
          resolution:
            # 480p verified accepted by the gateway on 2026-08-30; it rejects
            # anything outside {480p, 720p, 1080p}.
            options: [480p, 720p, 1080p]
            default: 1080p
          seed: true
          negativePrompt: false
          promptExtend: false
          watermark: true
        inputs:
          reference_images:
            max: 1
            reference_type: image
      r2v:
        legacy_id: seedance-2.0-r2v
        display_name: Seedance 2.0 R2V
        description: Reference-to-video with multi-image input
        capabilities: [r2v]
        ui:
          selection_group: r2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 80
          badges: [new]
        duration:
          type: slider
          min: 4
          max: 15
          step: 1
          default: 5
        params:
          resolution:
            # 480p verified accepted by the gateway on 2026-08-30; it rejects
            # anything outside {480p, 720p, 1080p}.
            options: [480p, 720p, 1080p]
            default: 1080p
          seed: true
          negativePrompt: false
          promptExtend: false
          watermark: true
        docs:
          context_hub_doc_ids:
            - seevio/seedance
            - mulerouter/seedance-2.0
        inputs:
          reference_images:
            max: 9
