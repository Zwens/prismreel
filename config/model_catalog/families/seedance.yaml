family: seedance
display_name: "Seedance (即梦)"
provider: byteplus
routing_prefixes:
  - seedance-2.0-
  - seedance-2.5-
  - seedance/seedance-
supported_backends:
  - byteplus
default_backend: byteplus
credential_sources:
  byteplus:
    - ARK_API_KEY
supported_modalities:
  - t2v
  - i2v
  - r2v
docs:
  official_snapshot_ids:
    - byteplus/modelark-seedance/2026-09-02
transport:
  image_input_mode:
    # Ark takes an image_url item that may be a public URL or a data URI.
    byteplus: byteplus_ark_image_url
  audio_input_mode: {}
  reference_video_input_mode: {}
models:
  - id: seedance/seedance-2.0-video
    display_name: Seedance 2.0
    description: ByteDance Seedance 2.0 video generation
    status: active
    release_stage: stable
    docs:
      context_hub_doc_ids:
        - byteplus/modelark-seedance-2.0
    runtime:
      byteplus:
        api_model_id: dreamina-seedance-2-0-260128
    modes:
      t2v:
        legacy_id: seedance-2.0-t2v
        display_name: Seedance 2.0 T2V
        description: Text-to-video generation
        capabilities: [t2v]
        ui:
          selection_group: t2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 85
          badges: [new]
        duration:
          type: slider
          min: 4
          max: 15
          step: 1
          default: 5
          allow_auto: true
        params:
          resolution:
            # Tier set per docs/api-reference/byteplus-ark-seedance-seedream.md
            # §2.2 (2026-09-02).
            options: [480p, 720p, 1080p, 4k]
            default: 720p
          ratio:
            options: ["16:9", "4:3", "1:1", "3:4", "9:16", "21:9", adaptive]
            default: adaptive
          seed: true
          negativePrompt: false
          promptExtend: false
          watermark: true
      i2v:
        legacy_id: seedance-2.0-i2v
        display_name: Seedance 2.0 I2V
        description: Image-to-video generation
        capabilities: [i2v]
        ui:
          selection_group: i2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 90
          badges: [new]
        duration:
          type: slider
          min: 4
          max: 15
          step: 1
          default: 5
          allow_auto: true
        params:
          resolution:
            # Tier set per docs/api-reference/byteplus-ark-seedance-seedream.md
            # §2.2 (2026-09-02).
            options: [480p, 720p, 1080p, 4k]
            default: 720p
          ratio:
            options: ["16:9", "4:3", "1:1", "3:4", "9:16", "21:9", adaptive]
            default: adaptive
          seed: true
          negativePrompt: false
          promptExtend: false
          watermark: true
        inputs:
          reference_images:
            max: 1
            reference_type: image
      r2v:
        legacy_id: seedance-2.0-r2v
        display_name: Seedance 2.0 R2V
        description: Reference-to-video with multi-image input
        capabilities: [r2v]
