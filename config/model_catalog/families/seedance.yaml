family: seedance
display_name: "Seedance (即梦)"
provider: byteplus
routing_prefixes:
  - seedance-2.0-
  - seedance-2.5-
  - seedance/seedance-
supported_backends:
  - byteplus
default_backend: byteplus
credential_sources:
  byteplus:
    - ARK_API_KEY
supported_modalities:
  - t2v
  - i2v
  - r2v
  # v2v 由 2026-09-08 实测确认：四个在售 dreamina-seedance 型号的 task_type
  # 均含 VideoEditing 且 input_modalities 含 video。此前目录漏标。
  - v2v
docs:
  official_snapshot_ids:
    - byteplus/modelark-seedance/2026-09-02
transport:
  video_input_mode:
    # Ark 的 content 数组接受 video_url 项，与 image_url 同构。
    byteplus: byteplus_ark_video_url
  image_input_mode:
    # Ark takes an image_url item that may be a public URL or a data URI.
    byteplus: byteplus_ark_image_url
  # Both left deliberately empty rather than omitted -- _require_mapping
  # wants all three keys, and an empty map makes provider_media raise
  # "family 'seedance' does not support backend 'byteplus' for modality X"
  # instead of silently sending something Ark will reject.
  #
  # Seedance takes no audio input at all: the Ark content array has no
  # audio role for it (`edit` can alter a source video's audio, but that
  # is an output-side concern).
  audio_input_mode: {}
  # Ark accepts content.role = reference_video on Seedance 2.5 and the 2.0
  # series; vedit / vext both require it, and so does the dance-swap flow,
  # which sends a locally-produced depth video.
  #
  # provider_media routes both the "video" and "reference_video" modalities
  # through this map (see _mode_for_modality), so leaving it empty meant a
  # local clip was handed to Ark as a bare filesystem path and rejected with
  # `content[n].video_url.url ... invalid url`.
  # See docs/api-reference/byteplus-ark-seedance-seedream.md §2.4.
  reference_video_input_mode:
    byteplus: byteplus_ark_video_url
models:
